<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>프로스트 빛반사</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;800&display=swap">
<style>
/* 레이아웃: 앱 매출조회 그대로 — 위에 프로스트 머리(상태바~검색), 아래로 매출 목록이 그 뒤를 지나감. 빛 띠는 머리 안에서만. */
:root{
  --bg:#F1F5F9; --fg:#0F172A; --sub:#64748B;
  --panel:rgba(255,255,255,.6); --card:#FFFFFF; --line:rgba(15,23,42,.06);
  --accent:#7C3AED; --pink:#FF0081;
  --glint:255,255,255; --glint-max:.55; --blend:soft-light; --holo-blend:overlay; --holo-max:.35;
  --font:"SUIT","Noto Sans KR",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121212; --fg:#F1F5F9; --sub:#94A3B8;
  --panel:rgba(45,45,45,.6); --card:#1E1E1E; --line:rgba(255,255,255,.06);
  --glint:255,255,255; --glint-max:.22; --blend:screen; --holo-blend:color-dodge; --holo-max:.16; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121212; --fg:#F1F5F9; --sub:#94A3B8;
  --panel:rgba(45,45,45,.6); --card:#1E1E1E; --line:rgba(255,255,255,.06);
  --glint:255,255,255; --glint-max:.22; --blend:screen; --holo-blend:color-dodge; --holo-max:.16; color-scheme:dark}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);overflow:hidden}
.app{position:relative;height:100%;max-width:440px;margin:0 auto;overflow:hidden}
/* 목록 — 머리 뒤로 흐름 */
.list{position:absolute;inset:0;overflow-y:auto;padding:178px 16px 120px;display:flex;flex-direction:column;gap:10px;-webkit-overflow-scrolling:touch}
.day{font-size:12px;color:var(--sub);font-weight:600;padding:8px 4px 0}
.row{background:var(--card);border-radius:16px;padding:14px 16px;display:flex;align-items:center;gap:12px;border:1px solid var(--line)}
.dot{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:14px;color:#fff;flex:none}
.row .name{font-weight:700;font-size:15px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .meta{font-size:12px;color:var(--sub);margin-top:2px}
.row .amt{margin-left:auto;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.row .amt.credit{color:var(--pink)}
/* 프로스트 머리 */
.head{position:absolute;left:0;right:0;top:0;border-radius:0 0 20px 20px;overflow:hidden;
  backdrop-filter:blur(11px);-webkit-backdrop-filter:blur(11px);background:var(--panel);
  box-shadow:0 0 10px rgba(0,0,0,.12);padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 16px;z-index:2}
.bar{display:flex;align-items:center;gap:10px;height:44px}
.bar h1{font-size:20px;margin:0;font-weight:800;letter-spacing:-.3px}
.bar .sp{flex:1}
.chip{font-size:12px;font-weight:700;padding:6px 10px;border-radius:999px;background:rgba(124,58,237,.12);color:var(--accent)}
.date{display:flex;align-items:center;justify-content:center;gap:16px;margin:6px 0 10px;font-weight:800;font-size:17px;font-variant-numeric:tabular-nums}
.date span{color:var(--accent);font-size:20px}
.search{height:44px;border-radius:14px;background:rgba(127,127,127,.12);display:flex;align-items:center;padding:0 14px;color:var(--sub);font-size:14px}
/* 바닐라틸트 반사광 — 라이브러리가 머리 안에 .js-tilt-glare를 만든다. 머리 둥근 모서리 안에서만 보이게 */
.head .js-tilt-glare{border-radius:0 0 20px 20px}
/* ★ 홀로 (우리 코드) — 반사광 + 무지개 포일 + 반짝이, 다크에서만.
   --mx/--my = 기울기로 정한 빛 위치(%), --hi = 세기(0~1). 포일·반짝이는 빛 근처에서만 살아난다(마스크). */
.holo{position:absolute;inset:0;pointer-events:none;display:none}
.holo>i{position:absolute;inset:0}
.h-foil{mix-blend-mode:color-dodge;opacity:calc(.7*var(--hi)*var(--hf));filter:brightness(.75) contrast(1.6) saturate(1.2);
  background:
    repeating-linear-gradient(110deg,hsl(355 85% 62%) 0%,hsl(40 90% 58%) 4%,hsl(120 70% 55%) 8%,hsl(190 85% 58%) 12%,hsl(255 80% 66%) 16%,hsl(320 85% 62%) 20%,hsl(355 85% 62%) 24%);
  background-size:500% 500%;
  background-position:calc(var(--mx)*1%) calc(var(--my)*1%);
  -webkit-mask-image:radial-gradient(ellipse 140% 340% at calc(var(--mx)*1%) calc(var(--my)*1%),#000 0%,rgba(0,0,0,.45) 35%,rgba(0,0,0,.08) 75%);
          mask-image:radial-gradient(ellipse 140% 340% at calc(var(--mx)*1%) calc(var(--my)*1%),#000 0%,rgba(0,0,0,.45) 35%,rgba(0,0,0,.08) 75%)}
.h-spark{mix-blend-mode:color-dodge;opacity:calc(var(--hi)*var(--hs));background-image:var(--spark);background-size:160px 160px;
  background-position:calc(var(--mx)*-1.2px) calc(var(--my)*-0.8px);
  -webkit-mask-image:radial-gradient(ellipse 140% 340% at calc(var(--mx)*1%) calc(var(--my)*1%),#000 0%,rgba(0,0,0,.25) 40%,transparent 70%);
          mask-image:radial-gradient(ellipse 140% 340% at calc(var(--mx)*1%) calc(var(--my)*1%),#000 0%,rgba(0,0,0,.25) 40%,transparent 70%)}
.h-lines{mix-blend-mode:overlay;opacity:calc(var(--hi)*var(--hl));
  background:repeating-linear-gradient(-35deg,rgba(255,255,255,.9) 0 1px,rgba(255,255,255,0) 1px 6px);
  background-position:calc(var(--mx)*.6px) 0;
  -webkit-mask-image:radial-gradient(ellipse 140% 340% at calc(var(--mx)*1%) calc(var(--my)*1%),#000 0%,rgba(0,0,0,.4) 35%,rgba(0,0,0,.05) 75%);
          mask-image:radial-gradient(ellipse 140% 340% at calc(var(--mx)*1%) calc(var(--my)*1%),#000 0%,rgba(0,0,0,.4) 35%,rgba(0,0,0,.05) 75%)}
.h-glare{mix-blend-mode:overlay;opacity:var(--hi);
  background:radial-gradient(ellipse 160% 420% at calc(var(--mx)*1%) calc(var(--my)*1%),rgba(255,255,255,.7) 0%,rgba(255,255,255,.38) 25%,rgba(255,255,255,.12) 50%,rgba(0,0,0,.25) 100%)}
.app[data-mode="holo"] .holo{display:block}
.app[data-mode="holo"] .js-tilt-glare{display:none}
:root[data-theme="light"] .holo{display:none!important}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) .holo{display:none!important}}
.seg .btn.on{background:var(--accent);color:#fff}
.note{font-size:11px;color:var(--sub)}
/* 조절판 */
.ctl{position:absolute;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);z-index:3;
  background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 14px;display:grid;gap:10px;box-shadow:0 6px 24px rgba(0,0,0,.12)}
.ctl .r{display:flex;align-items:center;gap:10px;font-size:13px}
.ctl label{color:var(--sub);flex:none;width:58px}
.ctl input[type=range]{flex:1;accent-color:var(--accent);min-width:0}
.status{font-size:12px;color:var(--sub);min-width:0}
.status b{color:var(--fg)}
.btn{border:0;border-radius:12px;padding:9px 12px;font:700 13px var(--font);background:var(--accent);color:#fff;flex:none}
.btn.ghost{background:rgba(124,58,237,.12);color:var(--accent)}
.btn:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.seg{display:flex;gap:6px;flex:1}
.seg .btn{flex:1}
</style>
</head>
<body>

<div class="app" id="app" data-mode="holo">
  <div class="list" id="list"></div>

  <header class="head" id="head">
    <div class="holo" id="holo"><i class="h-foil"></i><i class="h-lines"></i><i class="h-spark"></i><i class="h-glare"></i></div>
    <div class="bar"><span aria-hidden="true">←</span><h1>매출조회</h1><span class="sp"></span><span class="chip">외상만</span></div>
    <div class="date"><span>‹</span>26.10.02 (금)<span>›</span></div>
    <div class="search">거래처 검색</div>
  </header>

  <div class="ctl">
    <div class="r"><div class="status" id="status">폰을 좌우로 기울여 보세요</div><span style="flex:1"></span><button class="btn" id="perm" hidden>센서 켜기</button></div>
    <div class="r"><label>방식</label><div class="seg" id="modes"><button class="btn ghost on" data-m="holo">홀로 (새로)</button><button class="btn ghost" data-m="vanilla">바닐라</button></div></div>
    <div class="r"><label for="sF">무지개</label><input id="sF" type="range" min="0" max="150" value="80"></div>
    <div class="r"><label for="sS">별</label><input id="sS" type="range" min="0" max="150" value="90"></div>
    <div class="r"><label for="sL">사선 결</label><input id="sL" type="range" min="0" max="150" value="50"></div>
    <div class="r"><label for="amt">빛(전체)</label><input id="amt" type="range" min="0" max="100" value="75"></div>
    <div class="r"><label>테마</label><div class="seg"><button class="btn ghost" id="tLight">데이</button><button class="btn ghost" id="tDark">다크</button><button class="btn ghost" id="tSys">시스템</button></div></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/vanilla-tilt@1.8.1/dist/vanilla-tilt.min.js"></script>
<script>
// 예시 매출 (실제 데이터 아님)
const rows=[["땅땅마트","외상 · 품목 6",184000,1],["에이스상회","현금 · 품목 3",52000,0],["공항신마트","외상 · 품목 12",582000,1],["장유식자재","카드 · 품목 4",96500,0],["율하슈퍼","외상 · 품목 8",213400,1],["김해유통","계좌 · 품목 2",38000,0],["진영마트","외상 · 품목 9",301200,1],["삼계상회","현금 · 품목 5",77000,0],["대청마트","외상 · 품목 7",165800,1],["내외식품","카드 · 품목 3",44200,0]];
const colors=["#7C3AED","#0EA5E9","#F59E0B","#10B981","#FF0081"];
const list=document.getElementById('list');
let html='<div class="day">오늘 · 예시 데이터</div>';
for(let k=0;k<2;k++)rows.forEach((r,i)=>{html+=`<div class="row"><div class="dot" style="background:${colors[(i+k)%5]}">${r[0][0]}</div><div style="min-width:0"><div class="name">${r[0]}</div><div class="meta">${r[1]}</div></div><div class="amt ${r[3]?'credit':''}">${r[2].toLocaleString()}원</div></div>`;if(i===4&&k===0)html+='<div class="day">어제</div>';});
list.innerHTML=html;

const head=document.getElementById('head'),status=document.getElementById('status'),amt=document.getElementById('amt');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
// ★ vanilla-tilt 1.8.1 (MIT, micku7zu) 원본 그대로. 머리는 안 기울이고(max 0) 반사광만.
VanillaTilt.init(head,{max:0,scale:1,speed:reduce?0:400,glare:true,'max-glare':amt.value/100,gyroscope:true,'full-page-listening':true,reset:false});
amt.addEventListener('input',()=>{head.vanillaTilt.settings['max-glare']=amt.value/100;});
let gotSensor=false;
addEventListener('deviceorientation',e=>{if(e.gamma==null||gotSensor)return;gotSensor=true;status.innerHTML='<b>기울기 센서</b>로 움직이는 중 (바닐라틸트)';});
setTimeout(()=>{if(!gotSensor)status.innerHTML='센서 신호 없음 → <b>손가락·마우스</b>로 움직여 보세요';},1500);
if(typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function'){const p=document.getElementById('perm');p.hidden=false;p.onclick=()=>DeviceOrientationEvent.requestPermission().then(r=>{p.hidden=r==='granted';}).catch(()=>{status.textContent='센서 권한이 거절됐어요';});}
// ── 홀로: 기울기 → 빛 위치(우리 계산). 처음 자세가 가운데, 손떨림은 부드럽게 ──
const app=document.getElementById('app');const sF=document.getElementById('sF'),sS=document.getElementById('sS'),sL=document.getElementById('sL');
// 반짝이 결(우리가 만든 무작위 점) — 이미지 파일 없이 캔버스로 생성
(function(){const c=document.createElement('canvas');c.width=c.height=160;const g=c.getContext('2d');for(let n=0;n<220;n++){const x=Math.random()*160,y=Math.random()*160,r=Math.random()*1.3+.3,a=Math.random()*.9+.1;g.fillStyle=`hsla(${Math.random()*360},90%,80%,${a})`;g.beginPath();g.arc(x,y,r,0,7);g.fill();}app.style.setProperty('--spark',`url(${c.toDataURL()})`);})();
let bG=null,bB=null,tmx=50,tmy=40,mx=50,my=40;
addEventListener('deviceorientation',e=>{if(e.gamma==null)return;if(bG===null){bG=e.gamma;bB=e.beta;}bG+=(e.gamma-bG)*.002;bB+=(e.beta-bB)*.002;tmx=Math.min(100,Math.max(0,50+(e.gamma-bG)*2.4));tmy=Math.min(100,Math.max(0,40+(e.beta-bB)*3));});
function px(cx,cy){if(bG!==null)return;const r=head.getBoundingClientRect();tmx=Math.min(100,Math.max(0,(cx-r.left)/r.width*100));tmy=Math.min(100,Math.max(0,(cy-r.top)/r.height*100));}
addEventListener('pointermove',e=>px(e.clientX,e.clientY));
addEventListener('touchmove',e=>px(e.touches[0].clientX,e.touches[0].clientY),{passive:true});
(function hl(){const k=reduce?1:.14;mx+=(tmx-mx)*k;my+=(tmy-my)*k;app.style.setProperty('--mx',mx.toFixed(2));app.style.setProperty('--my',my.toFixed(2));app.style.setProperty('--hi',(amt.value/100).toFixed(2));app.style.setProperty('--hf',(sF.value/100).toFixed(2));app.style.setProperty('--hs',(sS.value/100).toFixed(2));app.style.setProperty('--hl',(sL.value/100).toFixed(2));requestAnimationFrame(hl);})();
document.querySelectorAll('#modes .btn').forEach(b=>b.onclick=()=>{app.dataset.mode=b.dataset.m;document.querySelectorAll('#modes .btn').forEach(o=>o.classList.toggle('on',o===b));});
const root=document.documentElement;
root.setAttribute('data-theme','dark'); // 홀로는 다크 전용 — 다크로 시작
document.getElementById('tLight').onclick=()=>root.setAttribute('data-theme','light');
document.getElementById('tDark').onclick=()=>root.setAttribute('data-theme','dark');
document.getElementById('tSys').onclick=()=>root.removeAttribute('data-theme');
</script>
</body>
</html>
