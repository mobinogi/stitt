<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>프로스트 빛반사</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;800&display=swap">
<style>
/* 레이아웃: 앱 매출조회 그대로 — 위에 프로스트 머리(상태바~검색), 아래로 매출 목록이 그 뒤를 지나감. 빛 띠는 머리 안에서만. */
:root{
  --bg:#F1F5F9; --fg:#0F172A; --sub:#64748B;
  --panel:rgba(255,255,255,.6); --card:#FFFFFF; --line:rgba(15,23,42,.06);
  --accent:#7C3AED; --pink:#FF0081;
  --glint:255,255,255; --glint-max:.55; --blend:soft-light; --holo-blend:overlay; --holo-max:.35;
  --font:"SUIT","Noto Sans KR",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121212; --fg:#F1F5F9; --sub:#94A3B8;
  --panel:rgba(45,45,45,.6); --card:#1E1E1E; --line:rgba(255,255,255,.06);
  --glint:255,255,255; --glint-max:.22; --blend:screen; --holo-blend:color-dodge; --holo-max:.16; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121212; --fg:#F1F5F9; --sub:#94A3B8;
  --panel:rgba(45,45,45,.6); --card:#1E1E1E; --line:rgba(255,255,255,.06);
  --glint:255,255,255; --glint-max:.22; --blend:screen; --holo-blend:color-dodge; --holo-max:.16; color-scheme:dark}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);overflow:hidden}
.app{position:relative;height:100%;max-width:440px;margin:0 auto;overflow:hidden}
/* 목록 — 머리 뒤로 흐름 */
.list{position:absolute;inset:0;overflow-y:auto;padding:178px 16px 120px;display:flex;flex-direction:column;gap:10px;-webkit-overflow-scrolling:touch}
.day{font-size:12px;color:var(--sub);font-weight:600;padding:8px 4px 0}
.row{background:var(--card);border-radius:16px;padding:14px 16px;display:flex;align-items:center;gap:12px;border:1px solid var(--line)}
.dot{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:14px;color:#fff;flex:none}
.row .name{font-weight:700;font-size:15px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .meta{font-size:12px;color:var(--sub);margin-top:2px}
.row .amt{margin-left:auto;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.row .amt.credit{color:var(--pink)}
/* 프로스트 머리 */
.head{position:absolute;left:0;right:0;top:0;border-radius:0 0 20px 20px;overflow:hidden;
  backdrop-filter:blur(11px);-webkit-backdrop-filter:blur(11px);background:var(--panel);
  box-shadow:0 0 10px rgba(0,0,0,.12);padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 16px;z-index:2}
.bar{display:flex;align-items:center;gap:10px;height:44px}
.bar h1{font-size:20px;margin:0;font-weight:800;letter-spacing:-.3px}
.bar .sp{flex:1}
.chip{font-size:12px;font-weight:700;padding:6px 10px;border-radius:999px;background:rgba(124,58,237,.12);color:var(--accent)}
.date{display:flex;align-items:center;justify-content:center;gap:16px;margin:6px 0 10px;font-weight:800;font-size:17px;font-variant-numeric:tabular-nums}
.date span{color:var(--accent);font-size:20px}
.search{height:44px;border-radius:14px;background:rgba(127,127,127,.12);display:flex;align-items:center;padding:0 14px;color:var(--sub);font-size:14px}
/* ★ 빛 반사 — 굵기 다른 사선 띠 3개. --gx(0~1)=좌우 기울기, --gi(0~1)=세기 */
.glint{position:absolute;inset:0;pointer-events:none;mix-blend-mode:var(--blend);
  background:linear-gradient(115deg,
    transparent 0%, transparent 38%,
    rgba(var(--glint),calc(var(--glint-max)*var(--gi))) 41%, rgba(var(--glint),calc(var(--glint-max)*var(--gi))) 47%,
    transparent 50%, transparent 52%,
    rgba(var(--glint),calc(var(--glint-max)*.7*var(--gi))) 53.5%, rgba(var(--glint),calc(var(--glint-max)*.7*var(--gi))) 55%,
    transparent 57%, transparent 59%,
    rgba(var(--glint),calc(var(--glint-max)*.45*var(--gi))) 60%, rgba(var(--glint),calc(var(--glint-max)*.45*var(--gi))) 60.8%,
    transparent 62%, transparent 100%);
  background-size:320% 100%;background-position:calc(var(--gx)*100%) 0}
/* B. 부드러운 빛 한 덩어리 — 바닐라틸트 글레어처럼 */
.soft{position:absolute;inset:0;pointer-events:none;mix-blend-mode:var(--blend);
  background:radial-gradient(ellipse 70% 160% at calc(var(--px)*100%) calc(var(--py)*100%),
    rgba(var(--glint),calc(var(--glint-max)*1.1*var(--gi))) 0%, rgba(var(--glint),calc(var(--glint-max)*.35*var(--gi))) 35%, transparent 70%)}
/* C. 은은한 무지개 — 사선 띠보다 느리게 반대로 흐른다(깊이감) */
.holo{position:absolute;inset:0;pointer-events:none;mix-blend-mode:var(--holo-blend);opacity:calc(var(--holo-max)*var(--gi));
  background:repeating-linear-gradient(115deg,
    hsl(0 90% 70%) 0%, hsl(50 95% 65%) 6%, hsl(140 80% 60%) 12%, hsl(200 90% 65%) 18%, hsl(280 85% 70%) 24%, hsl(340 90% 70%) 30%);
  background-size:300% 100%;background-position:calc(var(--gx)*-60% + 30%) 0}
.app[data-mode="A"] .soft,.app[data-mode="A"] .holo{display:none}
.app[data-mode="B"] .glint,.app[data-mode="B"] .holo{display:none}
.app[data-mode="C"] .soft{display:none}
.seg .btn.on{background:var(--accent);color:#fff}
/* 조절판 */
.ctl{position:absolute;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);z-index:3;
  background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 14px;display:grid;gap:10px;box-shadow:0 6px 24px rgba(0,0,0,.12)}
.ctl .r{display:flex;align-items:center;gap:10px;font-size:13px}
.ctl label{color:var(--sub);flex:none;width:52px}
.ctl input[type=range]{flex:1;accent-color:var(--accent);min-width:0}
.status{font-size:12px;color:var(--sub);min-width:0}
.status b{color:var(--fg)}
.btn{border:0;border-radius:12px;padding:9px 12px;font:700 13px var(--font);background:var(--accent);color:#fff;flex:none}
.btn.ghost{background:rgba(124,58,237,.12);color:var(--accent)}
.btn:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.seg{display:flex;gap:6px;flex:1}
.seg .btn{flex:1}
</style>
</head>
<body>

<div class="app" id="app" data-mode="A">
  <div class="list" id="list"></div>

  <header class="head" id="head">
    <div class="glint" id="glint"></div>
    <div class="soft" id="soft"></div>
    <div class="holo" id="holo"></div>
    <div class="bar"><span aria-hidden="true">←</span><h1>매출조회</h1><span class="sp"></span><span class="chip">외상만</span></div>
    <div class="date"><span>‹</span>26.10.02 (금)<span>›</span></div>
    <div class="search">거래처 검색</div>
  </header>

  <div class="ctl">
    <div class="r"><div class="status" id="status">폰을 좌우로 기울여 보세요</div><span style="flex:1"></span><button class="btn" id="perm" hidden>센서 켜기</button></div>
    <div class="r"><label>방식</label><div class="seg" id="modes"><button class="btn ghost on" data-m="A">A 사선 띠</button><button class="btn ghost" data-m="B">B 은은한 빛</button><button class="btn ghost" data-m="C">C 띠+무지개</button></div></div>
    <div class="r"><label for="amt">세기</label><input id="amt" type="range" min="0" max="100" value="70"></div>
    <div class="r"><label>테마</label><div class="seg"><button class="btn ghost" id="tLight">데이</button><button class="btn ghost" id="tDark">다크</button><button class="btn ghost" id="tSys">시스템</button></div></div>
  </div>
</div>

<script>
// 예시 매출 (실제 데이터 아님)
const rows=[["땅땅마트","외상 · 품목 6",184000,1],["에이스상회","현금 · 품목 3",52000,0],["공항신마트","외상 · 품목 12",582000,1],["장유식자재","카드 · 품목 4",96500,0],["율하슈퍼","외상 · 품목 8",213400,1],["김해유통","계좌 · 품목 2",38000,0],["진영마트","외상 · 품목 9",301200,1],["삼계상회","현금 · 품목 5",77000,0],["대청마트","외상 · 품목 7",165800,1],["내외식품","카드 · 품목 3",44200,0]];
const colors=["#7C3AED","#0EA5E9","#F59E0B","#10B981","#FF0081"];
const list=document.getElementById('list');
let html='<div class="day">오늘 · 예시 데이터</div>';
for(let k=0;k<2;k++)rows.forEach((r,i)=>{html+=`<div class="row"><div class="dot" style="background:${colors[(i+k)%5]}">${r[0][0]}</div><div style="min-width:0"><div class="name">${r[0]}</div><div class="meta">${r[1]}</div></div><div class="amt ${r[3]?'credit':''}">${r[2].toLocaleString()}원</div></div>`;if(i===4&&k===0)html+='<div class="day">어제</div>';});
list.innerHTML=html;

const glint=document.getElementById('glint'),status=document.getElementById('status'),amt=document.getElementById('amt');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
let tx=.5,ti=.8,x=.5,i=.8,ty=.4,y=.4,source='none',lastSensor=0;
// 기울기 → 목표값. 좌우(gamma)와 앞뒤(beta) 둘 다 빛을 사선 방향으로 밀어낸다.
//   앞뒤 기준은 처음 잡은 각도(손에 든 자세가 사람마다 달라서) — 그 자세가 가운데.
let baseB=null;
function fromTilt(g,b){
  b=b??45; if(baseB===null)baseB=b;
  baseB+=(b-baseB)*0.002; // 자세를 오래 바꾸면 기준도 천천히 따라옴
  const db=b-baseB;
  tx=Math.min(1,Math.max(0,.5+g/70+db/60));
  ty=Math.min(1,Math.max(0,.4+db/50));
  ti=Math.min(1,Math.max(.4,.9-Math.abs(db)/150));
}
addEventListener('deviceorientation',e=>{if(e.gamma==null)return;source='sensor';lastSensor=performance.now();fromTilt(e.gamma,e.beta);status.innerHTML='<b>기울기 센서</b>로 움직이는 중';});
// iOS는 권한 버튼이 필요
if(typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function'){const p=document.getElementById('perm');p.hidden=false;p.onclick=()=>DeviceOrientationEvent.requestPermission().then(r=>{p.hidden=r==='granted';}).catch(()=>{status.textContent='센서 권한이 거절됐어요. 화면을 끌어서 보세요';});}
// 센서가 막힌 환경(PC·일부 앱 화면)용: 마우스·손가락 위치로 기울기 흉내
function fake(cx){if(performance.now()-lastSensor<1500)return;source='pointer';const r=document.getElementById('app').getBoundingClientRect();tx=Math.min(1,Math.max(0,(cx-r.left)/r.width));ti=.85;ty=.4;status.innerHTML='센서 신호 없음 → <b>손가락·마우스 위치</b>로 흉내 중';}
addEventListener('pointermove',e=>fake(e.clientX));
addEventListener('touchmove',e=>fake(e.touches[0].clientX),{passive:true});
setTimeout(()=>{if(source==='none')status.innerHTML='센서 신호가 없어요. <b>화면을 좌우로 끌어</b> 보세요';},1500);
// 부드럽게 따라가기(손떨림 걸러냄)
function loop(){const k=reduce?1:.12;x+=(tx-x)*k;y+=(ty-y)*k;i+=(ti-i)*k;const s=amt.value/100;const app=document.getElementById('app');app.style.setProperty('--gx',(1-x).toFixed(4));app.style.setProperty('--gi',(i*s).toFixed(3));app.style.setProperty('--px',x.toFixed(4));app.style.setProperty('--py',y.toFixed(4));requestAnimationFrame(loop);}
loop();
const root=document.documentElement;
document.querySelectorAll('#modes .btn').forEach(b=>b.onclick=()=>{document.getElementById('app').dataset.mode=b.dataset.m;document.querySelectorAll('#modes .btn').forEach(o=>o.classList.toggle('on',o===b));});
document.getElementById('tLight').onclick=()=>root.setAttribute('data-theme','light');
document.getElementById('tDark').onclick=()=>root.setAttribute('data-theme','dark');
document.getElementById('tSys').onclick=()=>root.removeAttribute('data-theme');
</script>
</body>
</html>
